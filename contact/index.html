<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100f">

  <title>Renato Bibolotti | Contact</title>
  <meta name="description" content="Información de contacto de Renato Bibolotti.">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PE">
  <meta property="og:url" content="https://rboarchives.com/contact/">
  <meta property="og:site_name" content="Renato Bibolotti Archives">
  <meta property="og:title" content="Renato Bibolotti | Contact">
  <meta property="og:description" content="Información de contacto de Renato Bibolotti.">
  <meta property="og:image" content="https://rboarchives.com/assets/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Renato Bibolotti | Contact">
  <meta name="twitter:description" content="Información de contacto de Renato Bibolotti.">
  <meta name="twitter:image" content="https://rboarchives.com/assets/social-preview.png">

  <link rel="preload" as="image" href="assets/slide-7.webp" fetchpriority="high">

  <style>
    :root {
      color-scheme: dark;
      --accent: #4bb7d5;
      --ink: #11100f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--ink) url("../assets/background-1.png") center / cover fixed;
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    main {
      width: min(100vw, calc(100dvh * 16 / 9));
      max-width: 100%;
      aspect-ratio: 16 / 9;
      margin: auto;
    }

    .slide {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink) url("../assets/background-1.png") center / cover;
      line-height: 0;
    }

    .slide-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      border-radius: 7px;
      background: transparent;
      line-height: normal;
      cursor: pointer;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms ease;
    }

    .hotspot:focus-visible { outline: none; }

    .hotspot::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -20% -2%;
      border: 2px solid var(--accent);
      border-radius: inherit;
      background: rgba(24, 73, 84, 0.25);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 0 16px rgba(75, 183, 213, 0.55);
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .hotspot::after {
      content: attr(data-icon);
      position: absolute;
      top: 50%;
      right: -10%;
      display: grid;
      width: min(2.35vw, 34px);
      min-width: 20px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      font: 700 clamp(12px, 1.15vw, 18px)/1 Arial, sans-serif;
      opacity: 0;
      transform: translateY(-50%) scale(0.82);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before,
    .hotspot:active::before,
    .hotspot.is-interacting::before {
      opacity: 1;
      transform: scale(1.02);
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after,
    .hotspot:active::after,
    .hotspot.is-interacting::after {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .hotspot:active,
    .hotspot.is-interacting { transform: scale(0.985); }

    .contact-email { left: 34.35%; top: 33.55%; width: 24.25%; height: 4.55%; }
    .contact-phone { left: 42.45%; top: 41.05%; width: 10.55%; height: 4.55%; }
    .contact-instagram { left: 38.15%; top: 48.65%; width: 11.80%; height: 4.55%; }

    @supports not (height: 100dvh) {
      main { width: min(100vw, calc(100vh * 16 / 9)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hotspot,
      .hotspot::before,
      .hotspot::after { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="slide" aria-label="Contacto de Renato Bibolotti">
      <img class="slide-image" src="assets/slide-7.webp" width="1920" height="1080" alt="Contacto de Renato Bibolotti" fetchpriority="high">
      <a class="hotspot contact-email" data-icon="✉" href="mailto:renabiboovie@hotmail.com" aria-label="Enviar correo a renabiboovie@hotmail.com"></a>
      <a class="hotspot contact-phone" data-icon="☎" href="tel:+51907903082" aria-label="Llamar al 907 903 082"></a>
      <a class="hotspot contact-instagram" data-icon="↗" href="https://www.instagram.com/sanbibolotti/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram de San Bibolotti"></a>
    </section>
  </main>

  <script>
    document.querySelectorAll('.hotspot').forEach((link) => {
      link.addEventListener('pointerdown', () => {
        link.classList.add('is-interacting');
        window.setTimeout(() => link.classList.remove('is-interacting'), 650);
      });
      link.addEventListener('pointercancel', () => link.classList.remove('is-interacting'));
    });
  </script>
</body>
</html>
