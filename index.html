<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[wabi] by Flow Neuro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
<style>
/* ═══════════════════════════════════════════════════════════════
   wabi · design tokens
   Light is default. Dark via [data-theme="dark"] on <html>.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── BRAND ── */
  --brand-50:  #eef0f7;
  --brand-100: #dde2ed;
  --brand-200: #b8c0d8;
  --brand-300: #8e9bc1;
  --brand-400: #7280b0;
  --brand-500: #5b6ca3;   /* wabi blue (preserved) */
  --brand-600: #4d5b8a;
  --brand-700: #3f4a73;
  --brand-800: #313a5c;
  --brand-900: #232940;

  /* ── SEMANTIC NEUTRALS (light) ── */
  --bg:          #f5f5f7;       /* desktop chrome */
  --bg-elev-0:   #ffffff;       /* card / sheet base */
  --bg-elev-1:   #fafafa;       /* recessed surface */
  --bg-elev-2:   #ececef;       /* sidebar / toolbar tint */
  --bg-hover:    rgba(0,0,0,.045);
  --bg-press:    rgba(0,0,0,.07);
  --bg-selected: rgba(91,108,163,.12);

  --hairline:       rgba(0,0,0,.10);
  --hairline-soft:  rgba(0,0,0,.06);
  --hairline-strong:rgba(0,0,0,.18);

  --text:        #1a1a1f;
  --text-muted:  #6b6b75;
  --text-faint:  #9a9aa3;
  --text-on-brand: #ffffff;

  /* ── BLOCK ACCENTS (de-saturated, harmonised) ── */
  --blk-a-bg:     #fbf5e6;
  --blk-a-fg:     #8a6a1c;
  --blk-a-border: #e6d390;
  --blk-b-bg:     #ecf6ef;
  --blk-b-fg:     #2a6e48;
  --blk-b-border: #a4d3b6;
  --blk-c-bg:     #eef2fb;
  --blk-c-fg:     #2c4789;
  --blk-c-border: #a8b9e0;
  --blk-d-bg:     #f2ecf7;
  --blk-d-fg:     #5d3690;
  --blk-d-border: #c5acdc;
  --blk-n-bg:     transparent;
  --blk-n-fg:     var(--text-muted);

  /* ── INTENT (relax/intense) ── */
  --relax-bg:     #e6f1fb;
  --relax-fg:     #1f5fa3;
  --intense-bg:   #fbeae6;
  --intense-fg:   #b53919;

  /* ── DESTRUCTIVE / SUCCESS ── */
  --danger-500:   #d93f3f;
  --danger-600:   #b53919;
  --success-500:  #1f9d62;

  /* ── RADII ── */
  --r-1: 4px;
  --r-2: 6px;
  --r-3: 8px;
  --r-4: 10px;
  --r-5: 14px;
  --r-6: 20px;
  --r-pill: 999px;

  /* ── SHADOWS — stacked, hairline-friendly ── */
  --sh-1: 0 1px 0 rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --sh-2: 0 1px 0 rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.08);
  --sh-3: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.12);
  --sh-pop: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.18);

  /* ── MOTION ── */
  --t-instant: 80ms ease;
  --t-fast:    140ms cubic-bezier(.4,0,.2,1);
  --t-base:    220ms cubic-bezier(.4,0,.2,1);
  --t-slow:    320ms cubic-bezier(.4,0,.2,1);

  /* ── TYPOGRAPHY ── */
  --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-serif:"New York", "Iowan Old Style", Georgia, serif;

  --fs-9:  9px;
  --fs-10: 10px;
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-15: 15px;
  --fs-17: 17px;
  --fs-22: 22px;
  --fs-28: 28px;
  --fs-34: 34px;

  /* ── LAYOUT ── */
  --sidebar-w:   232px;
  --header-h:    48px;
  --detail-w:    340px;
  --gutter-w:    56px;
  --row-h:       44px;
  --tabbar-h:    62px;
}

/* ═══ DARK ═══ */
[data-theme="dark"] {
  --bg:          #1c1c1f;
  --bg-elev-0:   #232327;
  --bg-elev-1:   #2a2a2f;
  --bg-elev-2:   #2f2f35;
  --bg-hover:    rgba(255,255,255,.06);
  --bg-press:    rgba(255,255,255,.10);
  --bg-selected: rgba(142,155,193,.18);

  --hairline:       rgba(255,255,255,.10);
  --hairline-soft:  rgba(255,255,255,.05);
  --hairline-strong:rgba(255,255,255,.18);

  --text:        #f0f0f3;
  --text-muted:  #a0a0aa;
  --text-faint:  #6c6c75;

  --blk-a-bg:     rgba(230,211,144,.12);
  --blk-a-fg:     #e6d390;
  --blk-a-border: rgba(230,211,144,.35);
  --blk-b-bg:     rgba(164,211,182,.10);
  --blk-b-fg:     #a4d3b6;
  --blk-b-border: rgba(164,211,182,.35);
  --blk-c-bg:     rgba(168,185,224,.10);
  --blk-c-fg:     #b8c5e6;
  --blk-c-border: rgba(168,185,224,.35);
  --blk-d-bg:     rgba(197,172,220,.10);
  --blk-d-fg:     #c5acdc;
  --blk-d-border: rgba(197,172,220,.35);

  --relax-bg:     rgba(106,177,255,.16);
  --relax-fg:     #a8caff;
  --intense-bg:   rgba(255,133,133,.16);
  --intense-fg:   #ffa8a8;

  --sh-1: 0 1px 0 rgba(0,0,0,.20), 0 1px 2px rgba(0,0,0,.40);
  --sh-2: 0 1px 0 rgba(0,0,0,.20), 0 4px 12px rgba(0,0,0,.40);
  --sh-3: 0 1px 0 rgba(0,0,0,.20), 0 8px 24px rgba(0,0,0,.50);
  --sh-pop: 0 0 0 1px rgba(255,255,255,.06), 0 12px 32px rgba(0,0,0,.55);
}
/* ═══════════════════════════════════════════════════════════════
   wabi · base + layout
   Desktop-first (≥1024). Mobile in mobile.css.
   ═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-13);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}

button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 1px; border-radius: var(--r-2); }

/* ───────── APP SHELL ───────── */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

/* ───────── TITLEBAR ───────── */
.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--bg-elev-2);
  border-bottom: 1px solid var(--hairline);
  position: relative;
  z-index: 50;
  user-select: none;
}
.titlebar-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.titlebar-right { display: flex; align-items: center; gap: 6px; }

/* Brand mark — uses the cleaned PNG */
.brand-mark {
  display: flex; align-items: baseline; gap: 6px;
  height: 28px; flex-shrink: 0;
  padding: 0 4px;
  user-select: none;
}
.brand-wordmark {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1;
}
.brand-wordmark .brand-bracket { color: var(--brand-500); font-weight: 500; }
.brand-tagline {
  font-family: var(--font-serif);
  font-size: 11px;
  font-style: italic;
  color: var(--text-muted);
  line-height: 1;
  letter-spacing: 0;
}
.brand-tagline-by { font-style: normal; opacity: .7; margin-right: 1px; }

/* Date nav */
.date-nav.only-desktop,
.date-nav {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  box-shadow: var(--sh-1);
  white-space: nowrap;
  flex-shrink: 0;
  flex-wrap: nowrap;
}
.btn-date-arrow {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 13px;
  transition: background var(--t-fast), color var(--t-fast);
}
.btn-date-arrow:hover { background: var(--bg-hover); color: var(--text); }
.btn-date-arrow:active { background: var(--bg-press); }

.btn-today {
  height: 24px;
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  border-radius: var(--r-2);
  transition: background var(--t-fast);
}
.btn-today:hover { background: var(--bg-hover); }
.btn-today:active { background: var(--bg-press); }

.date-nav-label {
  height: 24px;
  padding: 0 10px 0 8px;
  display: inline-flex; align-items: center;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  border-left: 1px solid var(--hairline-soft);
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.current-date {
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-width: 138px;
  text-align: center;
}

/* Segmented control (Todo/Pendientes) */
.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.02);
}
.seg-btn {
  height: 24px;
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text-muted);
  border-radius: var(--r-2);
  transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
  white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn[aria-pressed="true"] {
  background: var(--bg-elev-0);
  color: var(--text);
  box-shadow: var(--sh-1);
}

/* Mode pill (intent) */
.mode-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), border-color var(--t-fast);
}
.mode-pill:hover { background: var(--bg-elev-1); }
.mode-pill .mode-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint);
  transition: background var(--t-base);
}
.mode-pill[data-mode="relax"]   .mode-dot { background: var(--relax-fg); }
.mode-pill[data-mode="intense"] .mode-dot { background: var(--intense-fg); }
.mode-pill[data-mode="relax"]   { background: var(--relax-bg);   border-color: transparent; color: var(--relax-fg); }
.mode-pill[data-mode="intense"] { background: var(--intense-bg); border-color: transparent; color: var(--intense-fg); }
.mode-pill .caret { font-size: 8px; opacity: .6; }

/* Toolbar icon button */
.tb-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 14px;
  transition: background var(--t-fast), color var(--t-fast);
}
.tb-icon:hover { background: var(--bg-hover); color: var(--text); }
.tb-icon:active { background: var(--bg-press); }

.btn-burger { display: none; }

/* ───────── MAIN GRID ───────── */
.main {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 0;
  overflow: hidden;
}

/* ───────── SIDEBAR ───────── */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-elev-2);
  border-right: 1px solid var(--hairline);
  padding: 8px 8px 12px;
  overflow-y: auto;
  min-height: 0;
}
.sidebar-section {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 12px 8px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--r-2);
  font-size: var(--fs-13);
  font-weight: 400;
  color: var(--text);
  text-align: left;
  transition: background var(--t-fast);
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item:active { background: var(--bg-press); }
.nav-item.is-active {
  background: var(--bg-selected);
  color: var(--text);
  font-weight: 500;
}
.nav-item .nav-icon {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
  font-size: 13px;
}
.nav-item.is-active .nav-icon { color: var(--brand-500); }
.nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-soon {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 2px 6px;
  border-radius: var(--r-pill);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  color: var(--text-faint);
  text-transform: uppercase;
}

.sidebar-footer { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }

/* Push-button language (bordered neutral) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  font-size: var(--fs-12);
  font-weight: 500;
  border-radius: var(--r-3);
  background: var(--bg-elev-0);
  color: var(--text);
  border: 1px solid var(--hairline);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), transform var(--t-instant), box-shadow var(--t-fast);
}
.btn:hover { background: var(--bg-elev-1); }
.btn:active { transform: translateY(0.5px); box-shadow: none; background: var(--bg-press); }

.btn--primary {
  background: var(--brand-500);
  color: var(--text-on-brand);
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
}
.btn--primary:hover { background: var(--brand-600); }
.btn--primary:active { background: var(--brand-700); transform: translateY(0.5px); }

.btn--destructive {
  background: var(--bg-elev-0);
  color: var(--danger-500);
  border-color: var(--hairline);
}
.btn--destructive:hover { background: var(--danger-500); color: #fff; border-color: transparent; }

.btn--ghost {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--text-muted);
}
.btn--ghost:hover { background: var(--bg-hover); color: var(--text); }

.btn--full { width: 100%; }
.btn--block { justify-content: flex-start; }

.btn-flowneuro {
  background: var(--brand-500);
  color: #fff;
  border: 1px solid var(--brand-600);
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
  font-weight: 500;
}
.btn-flowneuro:hover { background: var(--brand-600); }
.fn-flow  { font-family: var(--font-serif); font-style: italic; }
.fn-neuro { font-weight: 700; }

/* ───────── CONTENT AREA ───────── */
.content {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: var(--bg);
}

/* ───────── BOARD ───────── */
.board {
  display: grid;
  grid-template-rows: auto 1fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.board-headers {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7, minmax(140px, 1fr));
  background: var(--bg-elev-0);
  border-bottom: 1px solid var(--hairline);
  position: sticky;
  top: 0;
  z-index: 20;
}
.gutter-head { border-right: 1px solid var(--hairline-soft); }
.day-head {
  padding: 8px 12px 10px;
  border-right: 1px solid var(--hairline-soft);
  display: flex; flex-direction: column; gap: 4px;
}
.day-head:last-child { border-right: none; }
.day-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day-name { font-size: var(--fs-10); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
.day-num  { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1; }
.day-num--today {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px;
  padding: 0 6px;
  background: var(--brand-500);
  color: #fff;
  border-radius: var(--r-pill);
  font-size: var(--fs-12);
  font-weight: 700;
}
.day-progress {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-10);
  color: var(--text-faint);
}
.progress-track {
  flex: 1;
  height: 3px;
  background: var(--hairline-soft);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--success-500);
  border-radius: var(--r-pill);
  transition: width var(--t-slow);
}

/* Board body — grid: same template as headers, so columns stay aligned */
.board-body {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7, minmax(140px, 1fr));
  overflow-y: auto;
  overflow-x: auto;
  position: relative;
}

/* Time gutter — sticky LEFT */
.gutter {
  grid-column: 1;
  grid-row: 1;
  border-right: 1px solid var(--hairline-soft);
  position: sticky;
  left: 0;
  background: var(--bg-elev-0);
  z-index: 10;
}
.gutter-cell {
  height: var(--row-h);
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 4px 6px 0 0;
  font-size: var(--fs-10);
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--hairline-soft);
  background: var(--bg-elev-0);
}
.gutter-cell.blk-a { color: var(--blk-a-fg); background: var(--blk-a-bg); }
.gutter-cell.blk-b { color: var(--blk-b-fg); background: var(--blk-b-bg); }
.gutter-cell.blk-c { color: var(--blk-c-fg); background: var(--blk-c-bg); }
.gutter-cell.blk-d { color: var(--blk-d-fg); background: var(--blk-d-bg); }

/* Day columns */
.day-col {
  grid-row: 1;
  border-right: 1px solid var(--hairline-soft);
  position: relative;
  display: flex;
  flex-direction: column;
}
.day-col:last-child { border-right: none; }

/* Hour rows — empty backdrop, identical heights to gutter-cell */
.hour-rows { display: flex; flex-direction: column; }
.hour-row {
  height: var(--row-h);
  border-bottom: 1px solid var(--hairline-soft);
  flex-shrink: 0;
}
.hour-row.blk-a { background: var(--blk-a-bg); }
.hour-row.blk-b { background: var(--blk-b-bg); }
.hour-row.blk-c { background: var(--blk-c-bg); }
.hour-row.blk-d { background: var(--blk-d-bg); }

/* Block sections — overlaid via absolute, anchored to their start hour */
.block-section {
  position: absolute;
  left: 0; right: 0;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none; /* let bg row clicks pass through */
}
.block-section > * { pointer-events: auto; }
.block-label {
  font-size: var(--fs-9);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 2px 6px;
  border-radius: var(--r-1);
  width: fit-content;
  background: var(--bg-elev-0);
  border: 1px solid currentColor;
  opacity: .7;
}
.block-label.blk-a { color: var(--blk-a-fg); border-color: var(--blk-a-border); }
.block-label.blk-b { color: var(--blk-b-fg); border-color: var(--blk-b-border); }
.block-label.blk-c { color: var(--blk-c-fg); border-color: var(--blk-c-border); }
.block-label.blk-d { color: var(--blk-d-fg); border-color: var(--blk-d-border); }

.tasks-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Task card — hi-fi system UI feel */
.task-card {
  position: relative;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  padding: 7px 9px 7px 11px;
  box-shadow: var(--sh-1);
  cursor: default;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-instant), box-shadow var(--t-fast);
}
.task-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: var(--r-3) 0 0 var(--r-3);
  background: var(--text-faint);
  opacity: .55;
}
.task-card.blk-a::before { background: var(--blk-a-border); opacity: 1; }
.task-card.blk-b::before { background: var(--blk-b-border); opacity: 1; }
.task-card.blk-c::before { background: var(--blk-c-border); opacity: 1; }
.task-card.blk-d::before { background: var(--blk-d-border); opacity: 1; }

.task-card:hover { border-color: var(--hairline-strong); box-shadow: var(--sh-2); }
.task-card.is-selected {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 2px rgba(91,108,163,.18), var(--sh-1);
}
.task-card.is-done { opacity: .55; }
.task-card.is-done .task-title { text-decoration: line-through; color: var(--text-muted); }

.task-row { display: flex; align-items: flex-start; gap: 8px; }
.task-check {
  width: 16px; height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline-strong);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.task-check:hover { border-color: var(--brand-500); }
.task-check.is-done {
  background: var(--success-500);
  border-color: var(--success-500);
  animation: pop var(--t-fast);
}
.task-check.is-done::after {
  content: ''; width: 8px; height: 4px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(0px, -1px);
}

.task-title {
  flex: 1;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  line-height: 1.35;
  word-break: break-word;
  min-width: 0;
}

.task-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
  margin-left: 24px;
}
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--fs-10);
  font-weight: 500;
  color: var(--text-muted);
}
.tag-dot { width: 7px; height: 7px; border-radius: 50%; }

.chip-mini {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--fs-10);
  font-weight: 500;
  padding: 1px 6px;
  border-radius: var(--r-pill);
  background: var(--bg-elev-1);
  color: var(--text-muted);
  border: 1px solid var(--hairline-soft);
}
.chip-mini.is-relax   { background: var(--relax-bg);   color: var(--relax-fg);   border-color: transparent; }
.chip-mini.is-intense { background: var(--intense-bg); color: var(--intense-fg); border-color: transparent; }

/* Card delete (desktop hover) */
.card-actions {
  position: absolute;
  top: 4px; right: 4px;
  display: flex;
  gap: 2px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-fast);
}
.task-card:hover .card-actions { opacity: 1; pointer-events: auto; }
.btn-card-action {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 11px;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), color var(--t-fast);
}
.btn-card-action:hover { color: var(--danger-500); background: var(--bg-elev-1); }

/* Empty state inside columns */
.col-empty {
  margin: 8px 6px 0;
  padding: 8px;
  border: 1px dashed var(--hairline);
  border-radius: var(--r-3);
  font-size: var(--fs-11);
  color: var(--text-faint);
  text-align: center;
}

/* ───────── FAB ───────── */
.fab {
  position: absolute;
  bottom: 18px; right: 18px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--brand-500);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  font-weight: 300;
  line-height: 1;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 8px 22px rgba(91,108,163,.45), inset 0 0.5px 0 rgba(255,255,255,.20);
  transition: transform var(--t-fast), background var(--t-fast);
  z-index: 30;
}
.fab:hover { background: var(--brand-600); transform: translateY(-1px); }
.fab:active { transform: translateY(0px) scale(.96); }

/* ───────── DETAIL PANEL ───────── */
.detail {
  width: 0;
  background: var(--bg-elev-0);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-left: 1px solid transparent;
  transition: width var(--t-base), border-color var(--t-base);
  position: relative;
  z-index: 25;
}
.detail.is-open {
  width: var(--detail-w);
  border-left-color: var(--hairline);
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg-elev-2);
  flex-shrink: 0;
}
.detail-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.detail-date {
  font-size: var(--fs-12);
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.detail-header-actions { display: flex; align-items: center; gap: 2px; }
.detail-back-mobile { display: none; }
@media (max-width: 768px) {
  .detail-back-mobile { display: flex; }
  .detail-nav-desktop { display: none; }
  .detail-close-desktop { display: none; }
}

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 20px;
  display: flex; flex-direction: column; gap: 16px;
}

.detail-title-input {
  width: 100%;
  font-size: var(--fs-17);
  font-weight: 600;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: border-color var(--t-fast);
}
.detail-title-input:focus { border-bottom-color: var(--brand-500); }
.detail-title-input::placeholder { color: var(--text-faint); font-weight: 400; }

.section-label {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}

/* Timer */
.timer-card {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
  padding: 12px;
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-4);
}
.timer-cell { text-align: center; min-width: 0; }
.timer-cell-label {
  font-size: var(--fs-9);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-faint);
  margin-bottom: 3px;
}
.timer-cell-val {
  font-size: var(--fs-22);
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  transition: color var(--t-base);
}
.timer-cell-val.is-running { color: var(--success-500); }
.btn-timer {
  height: 32px;
  padding: 0 14px;
  border-radius: var(--r-3);
  background: var(--brand-500);
  color: #fff;
  font-size: var(--fs-12);
  font-weight: 600;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
  transition: background var(--t-fast);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-timer:hover { background: var(--brand-600); }
.btn-timer.is-running { background: var(--danger-500); }
.btn-timer.is-running:hover { background: var(--danger-600); }

/* Meta chips (detail) */
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.meta-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px;
  padding: 0 10px;
  font-size: var(--fs-12);
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  color: var(--text);
  cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast);
  user-select: none;
  white-space: nowrap;
}
.meta-chip:hover { background: var(--bg-hover); border-color: var(--hairline-strong); }
.meta-chip i { font-size: 11px; color: var(--text-muted); }
.meta-chip.is-set { color: var(--brand-500); border-color: rgba(91,108,163,.4); background: var(--brand-50); }
[data-theme="dark"] .meta-chip.is-set { background: rgba(91,108,163,.20); border-color: rgba(142,155,193,.5); color: #c5cee8; }

/* Subtasks */
.subtask-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--hairline-soft);
}
.subtask-row:last-child { border-bottom: none; }
.subtask-check {
  width: 14px; height: 14px;
  flex-shrink: 0;
  border: 1.5px solid var(--hairline-strong);
  border-radius: var(--r-1);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.subtask-check:hover { border-color: var(--brand-500); }
.subtask-check.is-done {
  background: var(--success-500);
  border-color: var(--success-500);
}
.subtask-check.is-done::after {
  content: ''; width: 6px; height: 3px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg);
}
.subtask-text {
  flex: 1;
  font-size: var(--fs-13);
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  padding: 2px 0;
}
.subtask-text.is-done { text-decoration: line-through; color: var(--text-muted); }
.subtask-delete {
  opacity: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-size: 11px;
  border-radius: var(--r-1);
  transition: opacity var(--t-fast), color var(--t-fast), background var(--t-fast);
}
.subtask-row:hover .subtask-delete { opacity: 1; }
.subtask-delete:hover { color: var(--danger-500); background: var(--bg-hover); }

.btn-subtask-add {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 0;
  font-size: var(--fs-12);
  color: var(--text-muted);
  transition: color var(--t-fast);
}
.btn-subtask-add:hover { color: var(--text); }

.subtask-input-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
  border-bottom: 1.5px solid var(--brand-500);
}
.subtask-input-row input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: var(--fs-13);
  color: var(--text);
}

/* Detail footer (delete) */
.detail-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--hairline);
  background: var(--bg-elev-1);
  flex-shrink: 0;
}

/* ───────── POPOVER ───────── */
.popover {
  position: fixed;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-4);
  box-shadow: var(--sh-pop);
  z-index: 950;
  overflow: hidden;
  min-width: 200px;
  animation: popoverIn var(--t-fast) both;
}
.popover-list { padding: 4px; }
.popover-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: var(--r-2);
  font-size: var(--fs-13);
  color: var(--text);
  cursor: pointer;
  transition: background var(--t-fast);
  user-select: none;
}
.popover-item:hover { background: var(--bg-selected); color: var(--text); }
.popover-item.is-selected { background: var(--bg-selected); }
.popover-item .check {
  width: 12px; height: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--brand-500);
}
.popover-item:not(.is-selected) .check { visibility: hidden; }
.popover-divider { height: 1px; background: var(--hairline-soft); margin: 4px 0; }
.popover-section-label {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 8px 10px 4px;
}
.popover-destructive { color: var(--danger-500) !important; }
.popover-destructive:hover { background: rgba(217,63,63,.12) !important; }

/* Time presets */
.time-presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 8px;
}
.time-preset {
  height: 32px;
  font-size: var(--fs-12);
  font-weight: 500;
  border-radius: var(--r-2);
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  color: var(--text);
  font-variant-numeric: tabular-nums;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.time-preset:hover { background: var(--bg-hover); border-color: var(--hairline-strong); }
.time-preset.is-selected { background: var(--brand-500); color: #fff; border-color: transparent; }

/* Mini calendar */
.cal {
  padding: 10px;
  width: 248px;
}
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 8px;
}
.cal-title { font-size: var(--fs-13); font-weight: 600; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  text-align: center;
}
.cal-dn {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  padding: 4px 0;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.cal-d {
  height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-12);
  border-radius: var(--r-2);
  cursor: pointer;
  transition: background var(--t-fast);
  font-variant-numeric: tabular-nums;
}
.cal-d:hover { background: var(--bg-hover); }
.cal-d.is-other { color: var(--text-faint); cursor: default; }
.cal-d.is-other:hover { background: transparent; }
.cal-d.is-today { color: var(--brand-500); font-weight: 700; }
.cal-d.is-selected { background: var(--brand-500); color: #fff; font-weight: 600; }

/* ───────── MODAL ───────── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 800;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn var(--t-fast) both;
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
.scrim.is-hidden { display: none; }

.modal {
  width: min(460px, 92vw);
  background: var(--bg-elev-0);
  border-radius: var(--r-5);
  box-shadow: var(--sh-3);
  border: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  overflow: visible;
  animation: modalIn var(--t-base) both;
}
.modal-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: var(--fs-14); font-weight: 600; }
.modal-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { padding: 12px 16px 14px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--hairline-soft); background: var(--bg-elev-1); border-radius: 0 0 var(--r-5) var(--r-5); }

.modal-input {
  width: 100%;
  font-size: var(--fs-15);
  font-weight: 500;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  padding: 6px 0;
  border-bottom: 1.5px solid var(--hairline);
  transition: border-color var(--t-fast);
}
.modal-input:focus { border-bottom-color: var(--brand-500); }
.modal-input::placeholder { color: var(--text-faint); font-weight: 400; }

/* ───────── TOAST ───────── */
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text);
  color: var(--bg-elev-0);
  padding: 8px 16px;
  border-radius: var(--r-pill);
  font-size: var(--fs-12);
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  box-shadow: var(--sh-3);
  transition: opacity var(--t-base), transform var(--t-base);
  white-space: nowrap;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ───────── ANIMATIONS ───────── */
@keyframes popoverIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn   { from { opacity: 0; transform: translateY(-12px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pop       { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes slideUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ───────── SCROLLBARS ───────── */
::-webkit-scrollbar       { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: var(--r-pill); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--hairline-strong); border: 2px solid transparent; background-clip: padding-box; }

/* ───────── MONTH VIEW ───────── */
.month {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  flex: 1;
  min-height: 0;
}
.month-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg-elev-0);
}
.month-title-grp { display: flex; align-items: center; gap: 8px; }
.month-title { font-size: var(--fs-15); font-weight: 600; }

.month-grid-head {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--bg-elev-0);
  border-bottom: 1px solid var(--hairline);
}
.month-dn {
  padding: 8px;
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  text-align: center;
  border-right: 1px solid var(--hairline-soft);
}
.month-dn:last-child { border-right: none; }

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(80px, 1fr);
  overflow-y: auto;
}
.month-cell {
  border-right: 1px solid var(--hairline-soft);
  border-bottom: 1px solid var(--hairline-soft);
  padding: 4px 6px 6px;
  cursor: pointer;
  transition: background var(--t-fast);
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}
.month-cell:nth-child(7n) { border-right: none; }
.month-cell:hover { background: var(--bg-hover); }
.month-cell.is-other { background: var(--bg-elev-1); color: var(--text-faint); }
.month-cell.is-selected { background: var(--bg-selected); }
.month-day-num {
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  align-self: flex-start;
  height: 22px;
  display: flex; align-items: center;
}
.month-cell.is-today .month-day-num {
  background: var(--brand-500);
  color: #fff;
  font-weight: 700;
  border-radius: 50%;
  min-width: 22px;
  justify-content: center;
}
.month-event {
  font-size: var(--fs-10);
  padding: 1px 6px;
  border-radius: var(--r-1);
  background: var(--brand-50);
  color: var(--brand-700);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
[data-theme="dark"] .month-event { background: rgba(91,108,163,.20); color: #b8c5e6; }
.month-event.is-relax   { background: var(--relax-bg);   color: var(--relax-fg); }
.month-event.is-intense { background: var(--intense-bg); color: var(--intense-fg); }
.month-event.is-done    { opacity: .55; text-decoration: line-through; }
.month-more {
  font-size: var(--fs-10);
  color: var(--text-faint);
  padding: 0 6px;
}

.month-detail {
  border-top: 1px solid var(--hairline);
  background: var(--bg-elev-0);
  padding: 12px 16px;
  max-height: 30vh;
  overflow-y: auto;
}
.month-detail-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.month-detail-title { font-size: var(--fs-13); font-weight: 600; }

/* mobile-only hidden utilities */

.only-desktop { display: initial; }
/* ═══════════════════════════════════════════════════════════════
   wabi · extras (overrides + new components)
   Order matters — loaded AFTER app.css and mobile.css
   ═══════════════════════════════════════════════════════════════ */

/* ───────── Theme switch ───────── */
.theme-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px;
  margin-bottom: 4px;
  border-radius: var(--r-3);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
}
.theme-toggle-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
}
.theme-toggle-label i { color: var(--text-muted); }
.theme-switch { width: 46px; height: 24px; padding: 0; background: none; border: none; cursor: pointer; }
.theme-switch-track {
  display: flex; align-items: center; justify-content: space-between;
  position: relative; width: 46px; height: 24px; padding: 0 5px;
  background: var(--bg-elev-2); border: 1px solid var(--hairline);
  border-radius: var(--r-pill); transition: background var(--t-base);
}
[data-theme="dark"] .theme-switch-track { background: var(--brand-700); }
.theme-switch-icon { font-size: 10px; z-index: 1; color: var(--text-muted); transition: color var(--t-base); }
.theme-switch-icon--sun { color: #d97706; }
[data-theme="dark"] .theme-switch-icon--sun { color: var(--text-faint); }
[data-theme="dark"] .theme-switch-icon--moon { color: #fff; }
.theme-switch-thumb {
  position: absolute; left: 2px; top: 2px;
  width: 18px; height: 18px; background: #fff;
  border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform var(--t-base) cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] .theme-switch-thumb { transform: translateX(22px); background: #f0f0f3; }

/* Brand logo theme switching */
[data-theme="dark"] .brand-logo--light { display: none !important; }
[data-theme="dark"] .brand-logo--dark  { display: inline-block !important; }
.brand-logo--light { display: inline-block !important; }
.brand-logo--dark  { display: none !important; }

/* Today button */
.btn-today { font-weight: 600 !important; color: var(--brand-500) !important; }
.btn-today:hover { background: var(--brand-50) !important; }
[data-theme="dark"] .btn-today:hover { background: rgba(91,108,163,.18) !important; }

/* ───────── POPOVER over MODAL ───────── */
#modal-scrim    { z-index: 800; }
#onb-scrim      { z-index: 900; }
.popover        { z-index: 9500 !important; }
#popover-scrim  { z-index: 9400 !important; }

/* ───────── COMPACT POPOVERS (Renato fix — todos los popovers más chicos) ───── */
.popover {
  min-width: 160px !important;
  max-width: 240px !important;
  border-radius: var(--r-3) !important;
}
.popover-list { padding: 3px !important; }
.popover-item {
  padding: 6px 9px !important;
  font-size: 12px !important;
  gap: 6px !important;
  border-radius: var(--r-2) !important;
}
.popover-item .check { width: 11px !important; height: 11px !important; font-size: 9px !important; }
.popover-section-label { padding: 5px 9px 2px !important; font-size: 9px !important; }
.popover-divider { margin: 3px 4px !important; }

/* Compact time-presets (3-col, smaller cells) */
.time-presets--compact {
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 4px !important;
  padding: 6px !important;

  font-size: 11px !important;

}

/* Compact calendar picker — used everywhere a date is picked */
.cal, .cal--compact {
  width: 232px !important;
  padding: 8px !important;
}
.cal-head { padding: 0 2px 6px !important; }
.cal-title { font-size: 12px !important; font-weight: 600; }
.cal-d { height: 26px !important; font-size: 11px !important; }
.cal-dn { font-size: 9px !important; padding: 3px 0 1px !important; }
.cal--compact .cal-grid {

.cal--compact .cal-d {
  aspect-ratio: 1;
  font-size: 11px;
  padding: 0;
  display: flex; align-items: center; justify-content: center;

  border: 1px solid transparent;

@media (min-width: 769px) {

/* ───────── Hour rows: continuous block color (no internal seam) ─────────
   Renato: the 11AM / 5PM rows must look the same colour as the rest
   of their block. The hairline between rows of the same block is what
   was making them look different. Suppress it within blocks. */
.gutter-cell.blk-a + .gutter-cell.blk-a,
.gutter-cell.blk-b + .gutter-cell.blk-b,
.gutter-cell.blk-c + .gutter-cell.blk-c,
.gutter-cell.blk-d + .gutter-cell.blk-d {
  border-top: 1px solid transparent;
  margin-top: -1px; /* swallow the previous border-bottom seam visually */
}
.hour-row.blk-a + .hour-row.blk-a,
.hour-row.blk-b + .hour-row.blk-b,
.hour-row.blk-c + .hour-row.blk-c,
.hour-row.blk-d + .hour-row.blk-d {
  border-top: 1px solid transparent;
  margin-top: -1px;
}
/* Make sure the FIRST hour of a block has its color start crisp */
.gutter-cell.blk-a, .gutter-cell.blk-b, .gutter-cell.blk-c, .gutter-cell.blk-d,
.hour-row.blk-a, .hour-row.blk-b, .hour-row.blk-c, .hour-row.blk-d {
  border-bottom-color: transparent !important;
}
/* Re-add a single seam between DIFFERENT blocks (a→b, b→c, etc.) */
.gutter-cell.blk-a + .gutter-cell.blk-b,
.gutter-cell.blk-b + .gutter-cell.blk-c,
.gutter-cell.blk-c + .gutter-cell.blk-d,
.gutter-cell.blk-d + .gutter-cell.blk-a,
.gutter-cell:not([class*="blk-"]) + .gutter-cell.blk-a,
.gutter-cell.blk-a + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-b + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-c + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-d + .gutter-cell:not([class*="blk-"]) {
  border-top: 1px solid var(--hairline);
  margin-top: 0;
}
.hour-row.blk-a + .hour-row.blk-b,
.hour-row.blk-b + .hour-row.blk-c,
.hour-row.blk-c + .hour-row.blk-d,
.hour-row.blk-d + .hour-row.blk-a,
.hour-row:not([class*="blk-"]) + .hour-row.blk-a,
.hour-row.blk-a + .hour-row:not([class*="blk-"]),
.hour-row.blk-b + .hour-row:not([class*="blk-"]),
.hour-row.blk-c + .hour-row:not([class*="blk-"]),
.hour-row.blk-d + .hour-row:not([class*="blk-"]) {
  border-top: 1px solid var(--hairline);
  margin-top: 0;
}

   wabi · mobile (≤768px)
   App-native feel: bottom sheets, full-screen views, tab bar.

  .sidebar-mobile-head .brand-mark { padding: 0; }
  .nav-item { padding: 10px 10px; font-size: var(--fs-15); }
  .nav-item .nav-icon { width: 22px; height: 22px; font-size: 15px; }

  /* Content holds: secondary header (filters/date) + scrollable body */
  .content { background: var(--bg); }

  /* ───── Mobile sub-header (filters segmented + date) ───── */
  .mobile-subheader {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline-soft);
    flex-shrink: 0;
  }
  .mobile-subheader .seg {
    display: inline-flex;
    flex: 0 0 auto;
  }
  .mobile-date {
    flex: 1;
    text-align: right;
    font-size: var(--fs-13);
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .mobile-day-strip {
    display: flex;
    gap: 6px;
    padding: 8px 12px 12px;
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mobile-day-strip::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    width: 48px;
    padding: 7px 0;
    border-radius: var(--r-3);
    background: var(--bg-elev-0);
    border: 1px solid var(--hairline);
    text-align: center;
    transition: background var(--t-fast), border-color var(--t-fast);
    cursor: pointer;
  }
  .day-pill-name {
    font-size: var(--fs-10);
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .day-pill-num {
    font-size: var(--fs-15);
    font-weight: 600;
    color: var(--text);
    margin-top: 2px;
  }
  .day-pill-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--brand-500);
    margin: 3px auto 0;
    opacity: 0;
  }
  .day-pill.has-tasks .day-pill-dot { opacity: 1; }
  .day-pill.is-today .day-pill-name { color: var(--brand-500); }
  .day-pill.is-today .day-pill-num { color: var(--brand-500); }
  .day-pill.is-selected {
    background: var(--brand-500);
    border-color: var(--brand-500);
  }
  .day-pill.is-selected .day-pill-name,
  .day-pill.is-selected .day-pill-num { color: #fff; }
  .day-pill.is-selected .day-pill-dot { background: #fff; }

  /* ───── Mobile board: agenda list grouped by block ───── */
  .board {
    grid-template-rows: 1fr;
    overflow: hidden;
  }
  .board-headers, .board-body { display: none; }

  .agenda {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 24px;
    background: var(--bg);
    -webkit-overflow-scrolling: touch;
  }
  .agenda-block {
    margin-top: 12px;
  }
  .agenda-block:first-child { margin-top: 4px; }
  .agenda-block-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  .agenda-block-name {
    font-size: var(--fs-11);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .agenda-block-name.blk-a { color: var(--blk-a-fg); }
  .agenda-block-name.blk-b { color: var(--blk-b-fg); }
  .agenda-block-name.blk-c { color: var(--blk-c-fg); }
  .agenda-block-name.blk-d { color: var(--blk-d-fg); }
  .agenda-block-name.blk-n { color: var(--text-muted); }
  .agenda-block-range {
    font-size: var(--fs-11);
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .agenda-block-bar {
    flex: 1;
    height: 1px;
    background: var(--hairline-soft);
  }
  .agenda-tasks {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Mobile task card — bigger, swipeable */
  .agenda-task {
    position: relative;
    overflow: hidden;
    background: var(--bg-elev-0);
    border: 1px solid var(--hairline);
    border-radius: var(--r-4);
    box-shadow: var(--sh-1);
  }
  .agenda-task-content {
    position: relative;
    padding: 12px 14px;
    background: var(--bg-elev-0);
    transform: translateX(0);
    transition: transform var(--t-base);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .agenda-task::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--text-faint);
    opacity: .5;
    z-index: 3;
    pointer-events: none;
  }
  .agenda-task.blk-a::before { background: var(--blk-a-border); opacity: 1; }
  .agenda-task.blk-b::before { background: var(--blk-b-border); opacity: 1; }
  .agenda-task.blk-c::before { background: var(--blk-c-border); opacity: 1; }
  .agenda-task.blk-d::before { background: var(--blk-d-border); opacity: 1; }
  .agenda-task .task-check {
    width: 22px; height: 22px;
    border-width: 2px;
  }
  .agenda-task .task-check.is-done::after {
    width: 10px; height: 5px;
    border-left-width: 2px;
    border-bottom-width: 2px;
  }
  .agenda-task-body { flex: 1; min-width: 0; }
  .agenda-task .task-title {
    font-size: var(--fs-15);
    font-weight: 500;
  }
  .agenda-task.is-done .task-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .agenda-task .task-meta {
    margin-left: 0;
    margin-top: 4px;
    gap: 6px;
  }
  .agenda-task-swipe-bg {
    position: absolute;
    inset: 0;
    background: var(--danger-500);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 22px;
    font-size: var(--fs-13);
    font-weight: 600;
    z-index: 1;
  }
  .agenda-task.swiped .agenda-task-content { transform: translateX(-90px); }

  /* Empty state */
  .agenda-empty {
    margin-top: 60px;
    padding: 32px 20px;
    text-align: center;
  }
  .agenda-empty-icon {
    font-size: 28px;
    color: var(--text-faint);
    margin-bottom: 12px;
  }
  .agenda-empty-title {
    font-size: var(--fs-15);
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .agenda-empty-sub {
    font-size: var(--fs-13);
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ───── Mobile detail panel = full-screen sheet ───── */
  .detail {
    position: fixed;
    inset: 0;
    width: 100% !important;
    height: 100%;
    z-index: 750;
    border-left: none !important;
    transform: translateY(100%);
    transition: transform var(--t-base);
    background: var(--bg-elev-0);
  }
  .detail.is-open {
    transform: translateY(0);
    border-left: none;
  }
  .detail-header {
    padding: 14px 14px;
    background: var(--bg-elev-0);
  }
  .detail-body {
    padding: 18px 16px 100px;
  }
  .detail-title-input {
    font-size: var(--fs-22);
  }

  /* ───── Mobile bottom sheet (popovers become sheets) ───── */
  .popover.is-mobile-sheet {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    top: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    border-radius: var(--r-5) var(--r-5) 0 0;
    animation: slideUp var(--t-base) both;
    box-shadow: 0 -8px 32px rgba(0,0,0,.25);
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }
  .popover.is-mobile-sheet::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--hairline-strong);
    border-radius: var(--r-pill);
    margin: 8px auto 4px;
  }
  .popover.is-mobile-sheet .popover-list { padding: 6px; }
  .popover.is-mobile-sheet .popover-item {
    padding: 12px 12px;
    font-size: var(--fs-15);
  }
  .popover.is-mobile-sheet .time-presets { padding: 12px; gap: 8px; }
  .popover.is-mobile-sheet .time-preset { height: 44px; font-size: var(--fs-14); }
  .popover.is-mobile-sheet .cal { width: 100%; padding: 14px; }
  .popover.is-mobile-sheet .cal-d { height: 40px; font-size: var(--fs-13); }

  /* ───── Mobile modal — full screen ───── */
  .scrim { align-items: flex-end; padding: 0; }
  .modal {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 92vh;
    border-radius: var(--r-5) var(--r-5) 0 0;
    animation: slideUp var(--t-base) both;
  }
  .modal-foot { border-radius: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }

  /* ───── Mobile FAB ───── */
  .fab {
    position: fixed;
    bottom: calc(var(--tabbar-h) + 14px);
    right: 16px;
    width: 52px; height: 52px;
    font-size: 28px;
  }

  /* ───── Tab bar ───── */
  .tabbar {
    display: flex;
    height: var(--tabbar-h);
    background: var(--bg-elev-0);
    border-top: 1px solid var(--hairline);
    z-index: 60;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-muted);
    padding: 6px 0 4px;
    font-size: 10px;
    font-weight: 500;
    transition: color var(--t-fast);
  }
  .tabbar-btn-icon {
    font-size: 19px;
    line-height: 1;
  }
  .tabbar-btn.is-active { color: var(--brand-500); }
  .tabbar-btn:active { background: var(--bg-hover); }

  /* Month view on mobile */
  .month-toolbar { padding: 10px 14px; }
  .month-grid { grid-auto-rows: minmax(60px, 1fr); }
  .month-cell { padding: 3px 4px; }
  .month-day-num { font-size: var(--fs-11); }
  .month-event { font-size: 9px; padding: 1px 4px; }
  .month-detail { max-height: 40vh; }

  /* Onboarding fills screen */
  .onb-card {
    width: 100% !important;
    max-width: 100% !important;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    animation: fadeIn var(--t-base) both;
  }
}

/* Tablet — keep desktop chrome but condense */
@media (min-width: 769px) and (max-width: 1023px) {
  :root {
    --sidebar-w: 200px;
    --detail-w: 300px;
  }
}

/* Hide tabbar on desktop */
@media (min-width: 769px) {
  .tabbar { display: none; }
  .mobile-subheader { display: none; }
  .mobile-day-strip { display: none; }
  .agenda { display: none; }
}

/* Wide desktop comfort */
@media (min-width: 1440px) {
  :root {
    --sidebar-w: 256px;
    --detail-w: 380px;
  }
}
/* ═══ Onboarding ═══ */
.onb-scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 900;
  display: flex; align-items: center; justify-content: center;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  animation: fadeIn var(--t-base) both;
}
.onb-scrim.is-hidden { display: none; }

.onb-card {
  width: min(520px, 92vw);
  max-height: 92vh;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-5);
  box-shadow: var(--sh-3);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.onb-art {
  height: 220px;
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand-50) 0%, var(--brand-100) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  border-bottom: 1px solid var(--hairline-soft);
}
[data-theme="dark"] .onb-art { background: linear-gradient(135deg, rgba(91,108,163,.18), rgba(91,108,163,.32)); }
.onb-art-step1 .onb-blob {
  width: 110px; height: 110px;
  border-radius: 28px;
  background: var(--brand-500);
  box-shadow: 0 14px 32px rgba(91,108,163,.45);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 48px; font-weight: 200;
}
.onb-art-step1 .onb-blob::before,
.onb-art-step1 .onb-blob::after {
  content: '';
  position: absolute;
  width: 70px; height: 70px;
  border-radius: 18px;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  box-shadow: var(--sh-2);
}
.onb-art-step1 .onb-blob::before { top: -28px; left: -54px; transform: rotate(-8deg); }
.onb-art-step1 .onb-blob::after { bottom: -22px; right: -54px; transform: rotate(7deg); }

/* Step 2 — block stripes */
.onb-art-step2 { gap: 6px; padding: 30px; flex-direction: column; align-items: stretch; }
.onb-stripe {
  height: 28px;
  border-radius: var(--r-2);
  display: flex; align-items: center;
  padding: 0 12px;
  font-size: var(--fs-11);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  border: 1px solid currentColor;
  border-color: transparent;
}
.onb-stripe-bar {
  height: 8px;
  border-radius: var(--r-pill);
  flex: 1;
  margin-left: 10px;
  opacity: .5;
}
.onb-stripe.blk-a { background: var(--blk-a-bg); color: var(--blk-a-fg); }
.onb-stripe.blk-a .onb-stripe-bar { background: var(--blk-a-border); }
.onb-stripe.blk-b { background: var(--blk-b-bg); color: var(--blk-b-fg); }
.onb-stripe.blk-b .onb-stripe-bar { background: var(--blk-b-border); }
.onb-stripe.blk-c { background: var(--blk-c-bg); color: var(--blk-c-fg); }
.onb-stripe.blk-c .onb-stripe-bar { background: var(--blk-c-border); }
.onb-stripe.blk-d { background: var(--blk-d-bg); color: var(--blk-d-fg); }
.onb-stripe.blk-d .onb-stripe-bar { background: var(--blk-d-border); }

/* Step 3 — modes preview */
.onb-art-step3 { gap: 12px; }
.onb-mode-card {
  width: 110px;
  padding: 12px 10px;
  border-radius: var(--r-4);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  text-align: center;
  box-shadow: var(--sh-1);
}
.onb-mode-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.onb-mode-icon.relax   { background: var(--relax-bg);   color: var(--relax-fg); }
.onb-mode-icon.normal  { background: var(--brand-50);   color: var(--brand-500); }
[data-theme="dark"] .onb-mode-icon.normal { background: rgba(91,108,163,.20); }
.onb-mode-icon.intense { background: var(--intense-bg); color: var(--intense-fg); }
.onb-mode-name {
  font-size: var(--fs-12);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.onb-mode-desc {
  font-size: var(--fs-10);
  color: var(--text-muted);
  line-height: 1.3;
}

.onb-content {
  padding: 24px 28px 8px;
  flex: 1;
  overflow-y: auto;
}
.onb-eyebrow {
  font-size: var(--fs-11);
  font-weight: 600;
  color: var(--brand-500);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.onb-title {
  font-size: var(--fs-22);
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: 8px;
  color: var(--text);
  text-wrap: balance;
}
.onb-body {
  font-size: var(--fs-14);
  color: var(--text-muted);
  line-height: 1.55;
  text-wrap: pretty;
  max-width: 42ch;
}

.onb-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px 18px;
  border-top: 1px solid var(--hairline-soft);
  flex-shrink: 0;
}
.onb-dots { display: flex; gap: 6px; align-items: center; }
.onb-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--hairline-strong);
  transition: background var(--t-fast), width var(--t-fast);
}
.onb-dot.is-active { background: var(--brand-500); width: 18px; border-radius: var(--r-pill); }

.onb-actions { display: flex; gap: 8px; align-items: center; }

@media (max-width: 768px) {
  .onb-card { display: flex; flex-direction: column; }
  .onb-art { height: 38vh; }
  .onb-content { padding: 28px 24px 16px; }
  .onb-title { font-size: var(--fs-28); }
  .onb-foot { padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
}

/* ── Board layout: bloques flex, sin scroll, 100% altura ── */
.board {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0; overflow: hidden; width: 100%;
}
.board-headers {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7,1fr);
  width: 100%;
  background: var(--bg-elev-0);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
}
.board-body {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7,1fr);
  width: 100%;
  flex: 1; min-height: 0; overflow: hidden;
}
.gutter {
  display: flex; flex-direction: column;
  background: var(--bg-elev-0);
  border-right: 1px solid var(--hairline);
  min-height: 0; overflow: hidden;
}
.gutter-cell {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  text-align: center; padding: 3px 2px;
  line-height: 1.2;
  border-bottom: 1px solid var(--hairline-soft);
}
.gutter-cell:last-child { border-bottom: none; }
.gutter-cell.blk-a { background: var(--blk-a-bg); color: var(--blk-a-fg); flex: 6; }
.gutter-cell.blk-b { background: var(--blk-b-bg); color: var(--blk-b-fg); flex: 6; }
.gutter-cell.blk-c { background: var(--blk-c-bg); color: var(--blk-c-fg); flex: 5; }
.gutter-cell.blk-d { background: var(--blk-d-bg); color: var(--blk-d-fg); flex: 7; }
.day-col {
  display: flex !important; flex-direction: column !important;
  border-right: 1px solid var(--hairline-soft);
  min-height: 0; overflow: hidden;
}
.day-col:last-child { border-right: none; }
.block-section {
  display: flex; flex-direction: column;
  padding: 4px 5px 3px !important;
  gap: 0;
  border-bottom: 1px solid var(--hairline-soft);
  min-height: 0; overflow: hidden;
  position: static !important;
  top: auto !important; height: auto !important; max-height: none !important;
}
.block-section:last-child { border-bottom: none; }
.block-section.blk-a { background: var(--blk-a-bg); flex: 6; }
.block-section.blk-b { background: var(--blk-b-bg); flex: 6; }
.block-section.blk-c { background: var(--blk-c-bg); flex: 5; }
.block-section.blk-d { background: var(--blk-d-bg); flex: 7; }
.block-label {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing:.05em;
  margin-bottom: 3px; flex-shrink: 0;
}
.block-label.blk-a { color: var(--blk-a-fg); }
.block-label.blk-b { color: var(--blk-b-fg); }
.block-label.blk-c { color: var(--blk-c-fg); }
.block-label.blk-d { color: var(--blk-d-fg); }
.block-section .tasks-stack {
  display: flex; flex-direction: column;
  gap: 3px; flex: 1; min-height: 0; overflow: hidden;
}
.hour-rows { display: none !important; }
/* Sidebar scrim */
.sidebar-scrim {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 790;
}
.sidebar-scrim.is-visible { display: block; }
/* Content relativa para FAB */
.content { position: relative; }
/* Month */
.month { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.month-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg-elev-0); flex-shrink: 0;
}
.month-title-grp { display: flex; align-items: center; gap: 10px; }
.month-title { font-size: 15px; font-weight: 700; }
.month-grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  flex: 1; min-height: 0; overflow: hidden;
}
.month-detail {
  padding: 12px 16px;
  border-top: 1px solid var(--hairline);
  background: var(--bg-elev-0);
  max-height: 260px; overflow-y: auto; flex-shrink: 0;
}
.month-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.month-detail-title { font-size: 13px; font-weight: 600; }
.month-detail-count { font-size: 12px; color: var(--text-muted); }
/* Layout wrappers */
#desktop-content-wrap {
  display: flex; flex: 1; overflow: hidden; min-height: 0;
}
#mobile-content-wrap {
  display: none; flex-direction: column;
  flex: 1; overflow: hidden; min-height: 0;
}
#mobile-content {
  display: flex; flex-direction: column;
  flex: 1; overflow: hidden; min-height: 0;
}

@media (min-width: 769px) {
