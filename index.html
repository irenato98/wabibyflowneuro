/* ════ CLOSE DROPDOWNS ════ */
function closeDropdowns() {
  // Remove dynamically-created chip dropdowns
  document.querySelectorAll('#chipDropdown').forEach(el => el.remove());

  // Hide static dropdowns
  const viewDD = document.getElementById('viewDropdown');
  const modeDD = document.getElementById('modeDropdown');
  if (viewDD) viewDD.style.display = 'none';
  if (modeDD) modeDD.style.display = 'none';

  document.getElementById('btnViewToggle')?.setAttribute('aria-expanded', 'false');
  document.getElementById('btnModeToggle')?.setAttribute('aria-expanded', 'false');

  if (activeDropdown) {
    activeDropdown.anchorBtn?.setAttribute('aria-expanded', 'false');
    const staticIds = ['viewDropdown','modeDropdown'];
    if (activeDropdown.el && !staticIds.includes(activeDropdown.el.id)) {
      activeDropdown.el.remove();
    }
    activeDropdown = null;
  }
}

/* ════ TIMER ════ */
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (selectedTask) {
    const t = tasks[selectedTask.key]?.[selectedTask.idx];
    if (t) t.timerRunning = false;
  }
}

function startTimerLoop() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!selectedTask) return;
    const t = tasks[selectedTask.key]?.[selectedTask.idx];
    if (!t || !t.timerRunning) { clearInterval(timerInterval); timerInterval = null; return; }
    t.timerSecs = (t.timerSecs || 0) + 1;
    const mi = Math.floor(t.timerSecs / 60);
    const se = t.timerSecs % 60;
    t.actual = `${mi}:${se.toString().padStart(2,'0')}`;
    const el = document.getElementById('timerActual');
    if (el) { el.textContent = t.actual; el.className = 'timer-val is-running'; }
    if (t.planned) {
      const [ph, pm] = t.planned.split(':').map(Number);
      const planned  = ((ph || 0) * 3600) + ((pm || 0) * 60);
      if (t.timerSecs >= planned) {
        clearInterval(timerInterval); timerInterval = null; t.timerRunning = false;
        saveTasks(); renderDetailPanel();
        if (currentView !== 'month') renderBoard(document.getElementById('contentArea'));
        showToast('¡Tiempo completado! ✓');
      }
    }
  }, 1000);
}

function toggleTimer() {
  if (!selectedTask) return;
  const t = tasks[selectedTask.key][selectedTask.idx];
  t.timerRunning = !t.timerRunning;
  if (t.timerRunning) {
    startTimerLoop();
    const btn = document.getElementById('btnStartStop');
    const val = document.getElementById('timerActual');
    if (btn) { btn.textContent = 'Detener'; btn.className = 'btn-start is-running'; }
    if (val) val.className = 'timer-val is-running';
  } else {
    stopTimer();
    const btn = document.getElementById('btnStartStop');
    if (btn) { btn.textContent = 'Start'; btn.className = 'btn-start'; }
    saveTasks();
    if (currentView !== 'month') renderBoard(document.getElementById('contentArea'));
  }
}

/* ════ SUBTASKS ════ */
function showSubtaskInput() {
  document.getElementById('btnSubtaskAdd').style.display    = 'none';
  document.getElementById('subtaskInputRow').style.display  = 'flex';
  document.getElementById('subtaskInput').focus();
}
function hideSubtaskInput() {
  document.getElementById('subtaskInputRow').style.display = 'none';
  document.getElementById('btnSubtaskAdd').style.display   = 'flex';
}
function addSubtask() {
  if (!selectedTask) return;
  const inp = document.getElementById('subtaskInput');
  const val = inp.value.trim();
  if (!val) { hideSubtaskInput(); return; }
  tasks[selectedTask.key][selectedTask.idx].subtasks.push({ text: val, done: false });
  saveTasks();
  renderDetailPanel();
}
function toggleSubtask(si) {
  if (!selectedTask) return;
  const subs = tasks[selectedTask.key][selectedTask.idx].subtasks;
  if (!subs[si]) return;
  subs[si].done = !subs[si].done;
  saveTasks();
  const list = document.getElementById('subtaskList');
  if (list) {
    list.innerHTML = subs.map((s, i) => `
      <div class="subtask-row">
        <div class="subtask-check${s.done ? ' is-done' : ''} js-sub-check"
          data-si="${i}" role="checkbox" aria-checked="${s.done}" tabindex="0"
          aria-label="${esc(s.text)}"></div>
        <span class="subtask-text${s.done ? ' is-done' : ''}">${esc(s.text)}</span>
      </div>`).join('');
    bindSubtaskChecks(list);
  }
}

/* ════ MONTH VIEW ════ */
function renderMonthView(container) {
  container.innerHTML = '';
  const y = monthViewDate.getFullYear();
  const m = monthViewDate.getMonth();
  const first = new Date(y,m,1).getDay();
  const dim   = new Date(y,m+1,0).getDate();
  const off   = first === 0 ? 6 : first - 1;

  let html = `<div class="month-view">
    <div class="month-header-bar">
      <div class="month-nav">
        <button class="btn-month-nav" onclick="navigateMonth(-1)">&#8249;</button>
        <span class="month-title">${capFirst(MONTHS_ES[m])} ${y}</span>
        <button class="btn-month-nav" onclick="navigateMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="month-grid-header" role="row">`;

  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
    html += `<div class="month-grid-day-name" role="columnheader">${d}</div>`;
  });

  html += `</div><div class="month-grid" id="monthGrid" role="grid">`;

  for (let i = 0; i < off; i++) {
    html += `<div class="month-cell" style="background:#FAFAFA;" aria-disabled="true"></div>`;
  }

  for (let i = 1; i <= dim; i++) {
    const d    = new Date(y,m,i);
    const key  = dateKey(d);
    const isTod = isToday(d);
    const isSel = selectedMonthDay && dateKey(selectedMonthDay) === key;
    let dt = tasks[key] || [];
    if (currentView === 'pending') dt = dt.filter(t => !t.done);
    const evts = dt.slice(0,3).map(t =>
      `<div class="month-event${t.type ? ' is-' + t.type : ''}${t.done ? ' is-done' : ''}">${esc(t.title)}</div>`
    ).join('');
    html += `<div class="month-cell${isTod ? ' is-today' : ''}${isSel ? ' is-selected' : ''}"
      onclick="selectMonthDay(${y},${m},${i})" role="gridcell" tabindex="0"
      aria-label="${i} de ${MONTHS_ES[m]}">
      <div class="month-day-num"><div class="${isTod ? 'month-day-num-inner' : ''}">${i}</div></div>
      ${evts}
    </div>`;
  }
  html += `</div>`;

  if (selectedMonthDay) {
    const key  = dateKey(selectedMonthDay);
    let dt = tasks[key] || [];
    if (currentView === 'pending') dt = dt.filter(t => !t.done);
    const dStr = `${DAYS_ES[selectedMonthDay.getDay()]} ${selectedMonthDay.getDate()} de ${MONTHS_ES[selectedMonthDay.getMonth()]}`;
    html += `<div class="month-day-detail">
      <div class="month-detail-header">
        <span class="month-detail-title">${esc(dStr)}</span>
        <span class="month-detail-count">${dt.length} actividad${dt.length !== 1 ? 'es' : ''}</span>
      </div>
      ${dt.length === 0
        ? `<p style="font-size:12px;color:var(--muted);">Sin actividades para este día.</p>`
        : dt.map((t, i) => `
          <div class="month-task-row">
            <div class="task-check${t.done ? ' is-done' : ''}" style="width:13px;height:13px;"
              onclick="toggleTaskFromMonth('${key}',${i})"
              role="checkbox" aria-checked="${t.done}" tabindex="0"></div>
            <span class="month-task-title${t.done ? ' is-done' : ''}">${esc(t.title)}</span>
            ${t.type ? `<span class="type-badge type-badge--${t.type}">${t.type === 'relax' ? 'Relax' : 'Intense'}</span>` : ''}
            ${t.category ? `<span class="tag" style="color:${(CATS.find(c => c.label === t.category) || {}).color || 'var(--muted)'}">${esc(t.category)}</span>` : ''}
          </div>`).join('')}
    </div>`;
  }

  // FAB for month view – uses selectedMonthDay or today
  const fabKey = selectedMonthDay ? dateKey(selectedMonthDay) : dateKey(new Date());
  html += `<button class="btn-fab" id="monthFab" type="button" aria-label="Añadir actividad"
    onclick="openAddModal('${fabKey}')">+</button>`;

  html += `</div>`;
  container.innerHTML = html;
}

function navigateMonth(dir) {
  monthViewDate.setMonth(monthViewDate.getMonth() + dir);
  selectedMonthDay = null;
  renderMonthView(document.getElementById('contentArea'));
}
function selectMonthDay(y, m, day) {
  selectedMonthDay = new Date(y,m,day);
  renderMonthView(document.getElementById('contentArea'));
}
function toggleTaskFromMonth(key, i) {
  if (!tasks[key]?.[i]) return;
  tasks[key][i].done = !tasks[key][i].done;
  saveTasks();
  renderMonthView(document.getElementById('contentArea'));
}

/* ════ QUICK ACTIONS ════ */
function handleRecomendar() {
  const text = `Hola 😊 Quiero recomendarte Wabi by Flow Neuro, una app pensada especialmente para adultos con TDAH como nosotros. Está diseñada para ayudarte a organizarte mejor sin sentirte abrumado, con herramientas adaptadas a cómo realmente funciona nuestra mente.\n\nPuedes verla aquí:\napp.flowneuro/wabi`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('Texto copiado ✓')).catch(() => copyFallback(text));
  } else {
    copyFallback(text);
  }
}
function copyFallback(text) {
  const ta = Object.assign(document.createElement('textarea'), { value: text, style: 'position:fixed;opacity:0;' });
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast('Texto copiado ✓'); } catch { showToast('Copia manualmente'); }
  document.body.removeChild(ta);
}

/* ════ TOAST ════ */
let toastTO;
function showToast(msg) {
  clearTimeout(toastTO);
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('is-visible');
  toastTO = setTimeout(() => t.classList.remove('is-visible'), 2800);
}

/* ════ EVENT DELEGATION ════ */
document.addEventListener('click', e => {
  const inChip = e.target.closest('#chipDropdown') || e.target.closest('[data-chip]') || e.target.closest('[data-mchip]');
  const inView = e.target.closest('#viewDropdown') || e.target.closest('#btnViewToggle');
  const inMode = e.target.closest('#modeDropdown') || e.target.closest('#btnModeToggle');
  if (!inChip && !inView && !inMode) closeDropdowns();

  // task card click → open detail
  const card = e.target.closest('.task-card');
  if (card && !e.target.closest('.js-task-check')) {
    const { key, idx } = card.dataset;
    if (key !== undefined) openTask(key, Number(idx));
    return;
  }

  // checkbox toggle
  const check = e.target.closest('.js-task-check');
  if (check) {
    e.stopPropagation();
    toggleTask(check.dataset.key, Number(check.dataset.idx));
    return;
  }

  // add modal button (inline + FAB)
  const addBtn = e.target.closest('.js-btn-add-modal');
  if (addBtn) { openAddModal(addBtn.dataset.key); return; }

  // modal overlay backdrop → close
  if (e.target === document.getElementById('addActivityModal')) { closeAddModal(); return; }

  // modal chip
  const mchip = e.target.closest('[data-mchip]');
  if (mchip) { e.stopPropagation(); openModalChip(mchip, mchip.dataset.mchip); return; }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDropdowns(); closeDetail(); closeAddModal(); }
  if (e.target.id === 'modalTitleInput' && e.key === 'Enter') confirmModal();
  if (e.target.classList.contains('js-add-input') && e.key === 'Enter') {
    const val = e.target.value.trim();
    if (val) {
      const k = e.target.dataset.key;
      openAddModal(k);
      setTimeout(() => {
        const inp = document.getElementById('modalTitleInput');
        if (inp) { inp.value = val; e.target.value = ''; }
      }, 60);
    }
  }
});

/* ════ WIRING ════ */
document.getElementById('btnToday').addEventListener('click', goToday);
document.getElementById('btnPrev').addEventListener('click', () => navigate(-1));
document.getElementById('btnNext').addEventListener('click', () => navigate(1));
document.getElementById('btnViewToggle').addEventListener('click', e => { e.stopPropagation(); toggleViewDropdown(); });
document.getElementById('btnModeToggle').addEventListener('click', e => { e.stopPropagation(); toggleModeDropdown(); });
document.getElementById('btnRecommend').addEventListener('click', handleRecomendar);
document.getElementById('btnFlowNeuro').addEventListener('click', () => window.open('https://www.skool.com/flowneuro-1684/about','_blank','noopener,noreferrer'));
document.getElementById('btnModalClose').addEventListener('click', closeAddModal);
document.getElementById('btnModalAdd').addEventListener('click', confirmModal);

document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => setMode(el.dataset.mode)));

// Sidebar nav items
document.getElementById('nav-board').addEventListener('click', () => setView('board'));
document.getElementById('nav-month').addEventListener('click', () => setView('month'));

// Mobile sidebar
const sidebar = document.getElementById('appSidebar');
const overlay  = document.getElementById('sidebarOverlay');
document.getElementById('btnSidebarToggle').addEventListener('click', () => {
  sidebar.classList.toggle('is-open');
  overlay.classList.toggle('is-visible');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('is-open');
  overlay.classList.remove('is-visible');
});

/* ════ INIT ════ */
renderAll();
</script>
