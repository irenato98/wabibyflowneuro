  <style>
    :root {
      color-scheme: dark;
      --accent: #4bb7d5;
      --accent-soft: rgba(75, 183, 213, 0.35);
      --ink: #11100f;
      --slide-ratio: 16 / 9;
    }

    * { box-sizing: border-box; }

    html {
      margin: 0;
      background: var(--ink) url("../assets/background-1.png") center / cover fixed;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--ink) url("../assets/background-1.png") center / cover fixed;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .slide {
      position: relative;
      width: 100%;
      aspect-ratio: var(--slide-ratio);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--ink) url("../assets/background-1.png") center / cover;
      line-height: 0;
      scroll-snap-align: start;
      scroll-margin-top: 0;
    }

    .slide-image,
    .hero-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Hero con el video original, en silencio y en loop. */
    .hero-video {
      z-index: 0;
      object-fit: cover;
      background: #000;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.22), transparent 46%),
        linear-gradient(270deg, rgba(0, 0, 0, 0.34), transparent 52%);
      pointer-events: none;
    }

    .hero-title {
      position: absolute;
      z-index: 2;
      top: 7.1%;
      left: 3.15%;
      margin: 0;
      color: var(--accent);
      font-size: clamp(20px, 2.55vw, 49px);
      font-weight: 800;
      letter-spacing: 0.035em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .hero-menu {
      position: absolute;
      z-index: 3;
      right: 4.15%;
      top: 53.1%;
      display: grid;
      justify-items: end;
      gap: clamp(3px, 0.55vw, 11px);
      line-height: normal;
    }

    .hero-link {
      display: inline-block;
      padding: 0.08em 0 0.12em;
      border-radius: 3px;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-position: right bottom;
      background-size: 100% max(1px, 0.07em);
      color: #fff;
      font-size: clamp(12px, 2.25vw, 44px);
      font-weight: 800;
      line-height: 1.05;
      text-align: right;
      text-decoration: none;
      text-shadow: 0 2px 9px rgba(0, 0, 0, 0.82);
      -webkit-tap-highlight-color: transparent;
      transition:
        color 160ms ease,
        filter 160ms ease,
        transform 160ms ease,
        background-size 160ms ease;
    }

    .hero-link:hover,
    .hero-link:focus-visible,
    .hero-link:active,
    .hero-link.is-interacting {
      color: #d9fbff;
      filter:
        drop-shadow(0 0 4px rgba(75, 183, 213, 0.95))
        drop-shadow(0 0 9px rgba(75, 183, 213, 0.7));
      transform: translateX(-0.18em);
      background-size: 100% max(2px, 0.105em);
      outline: none;
    }

    .hero-link:active,
    .hero-link.is-interacting {
      transform: translateX(-0.18em) scale(0.985);
    }

    .embed {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      background: #000;
      line-height: normal;
    }

    .embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Live Performance: el video ocupa únicamente el cuadro central. */
    .youtube-embed {
      left: 8.54%;
      top: 26.94%;
      width: 41.82%;
      height: 41.67%;
      overflow: visible;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .youtube-embed:fullscreen,
    .youtube-embed:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      box-shadow: none;
    }

    .video-controls {
      position: absolute;
      z-index: 5;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      line-height: normal;
    }

    .video-control {
      appearance: none;
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: rgba(17, 16, 15, 0.9);
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      color: #fff;
      font: 700 clamp(10px, 0.78vw, 14px)/1 Arial, sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .video-control:hover,
    .video-control:focus-visible,
    .video-control[aria-pressed="true"] {
      background: var(--accent);
      color: var(--ink);
      outline: none;
    }

    .video-control:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .video-control:active { transform: scale(0.96); }
    .video-control:disabled { cursor: wait; opacity: 0.72; }

    .video-control svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .audio-icon-on,
    .fullscreen-icon-close { display: none; }

    #youtube-audio-toggle[aria-pressed="true"] .audio-icon-off,
    #youtube-fullscreen-toggle[aria-pressed="true"] .fullscreen-icon-open { display: none; }

    #youtube-audio-toggle[aria-pressed="true"] .audio-icon-on,
    #youtube-fullscreen-toggle[aria-pressed="true"] .fullscreen-icon-close { display: block; }

    /* Studio Recordings: enlaces externos sobre las cuatro portadas. */
    .hotspot {
      position: absolute;
      z-index: 3;
      display: block;
      border-radius: 6px;
      background: transparent;
      line-height: normal;
      cursor: pointer;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot:focus-visible { outline: none; }

    .recording-link::before,
    .contact-hotspot::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border: 3px solid var(--accent);
      border-radius: inherit;
      background: rgba(24, 73, 84, 0.18);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16) inset,
        0 10px 24px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      pointer-events: none;
    }

    .recording-link::after {
      content: "↗";
      position: absolute;
      top: 7%;
      right: 7%;
      display: grid;
      width: 14%;
      min-width: 24px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font: 800 clamp(13px, 1.35vw, 24px)/1 Arial, sans-serif;
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .recording-link:hover::before,
    .recording-link:focus-visible::before,
    .recording-link:active::before,
    .recording-link.is-interacting::before,
    .contact-hotspot:hover::before,
    .contact-hotspot:focus-visible::before,
    .contact-hotspot:active::before,
    .contact-hotspot.is-interacting::before {
      opacity: 1;
      transform: scale(1.025);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 18px rgba(75, 183, 213, 0.6),
        0 16px 30px rgba(0, 0, 0, 0.38);
    }

    .recording-link:hover::after,
    .recording-link:focus-visible::after,
    .recording-link:active::after,
    .recording-link.is-interacting::after {
      opacity: 1;
      transform: scale(1);
    }

    .recording-link:active,
    .recording-link.is-interacting,
    .contact-hotspot:active,
    .contact-hotspot.is-interacting {
      transform: scale(0.985);
    }

    .recording-aka { left: 6.98%; top: 31.39%; width: 16.88%; height: 30.19%; }
    .recording-rose { left: 25.21%; top: 31.30%; width: 17.14%; height: 30.37%; }
    .recording-skull { left: 43.65%; top: 31.20%; width: 17.24%; height: 30.46%; }
    .recording-eye { left: 62.14%; top: 31.30%; width: 17.08%; height: 30.37%; }

    /* Segundo slide de Studio Recordings: se conserva el embed de SoundCloud. */
    .soundcloud-embed {
      left: 17.5%;
      top: 25.5%;
      width: 65%;
      height: 59%;
      background: transparent;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 13px 34px rgba(0, 0, 0, 0.38);
    }

    .soundcloud-player-list { display: none !important; }

    /* Datos clicables del nuevo slide de contacto. */
    .contact-hotspot {
      border-radius: 7px;
      transition: filter 160ms ease, transform 160ms ease;
    }

    .contact-hotspot::before {
      inset: -20% -2%;
      border-width: 2px;
      background: rgba(24, 73, 84, 0.25);
    }

    .contact-hotspot::after {
      content: attr(data-icon);
      position: absolute;
      top: 50%;
      right: -10%;
      display: grid;
      width: min(2.35vw, 34px);
      min-width: 20px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      font: 700 clamp(12px, 1.15vw, 18px)/1 Arial, sans-serif;
      opacity: 0;
      transform: translateY(-50%) scale(0.82);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }

    .contact-hotspot:hover::after,
    .contact-hotspot:focus-visible::after,
    .contact-hotspot:active::after,
    .contact-hotspot.is-interacting::after {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .contact-email { left: 34.35%; top: 33.55%; width: 24.25%; height: 4.55%; }
    .contact-phone { left: 42.45%; top: 41.05%; width: 10.55%; height: 4.55%; }
    .contact-instagram { left: 38.15%; top: 48.65%; width: 11.80%; height: 4.55%; }

    /* Navegación lateral discreta. */
    .slide-nav {
      position: fixed;
      z-index: 20;
      top: 50%;
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 11px 8px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.56);
      transform: translateY(-50%);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .slide-nav button {
      width: 11px;
      height: 11px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #777;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    .slide-nav button[aria-current="true"] {
      background: var(--accent);
      transform: scale(1.2);
    }

    .slide-nav button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 767px) {
      .video-controls { top: 5px; right: 5px; gap: 5px; }

      .video-control {
        width: 34px;
        min-width: 34px;
        height: 34px;
        min-height: 34px;
        padding: 0;
        border-width: 1px;
      }

      .video-control svg { width: 17px; height: 17px; }

      .control-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .soundcloud-player-visual { display: none !important; }
      .soundcloud-player-list { display: block !important; }
    }

    @media (max-width: 600px) {
      .slide-nav {
        right: max(6px, env(safe-area-inset-right));
        gap: 7px;
        padding: 8px 6px;
      }

      .slide-nav button { width: 8px; height: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-link,
      .recording-link::before,
      .recording-link::after,
      .contact-hotspot::before,
      .contact-hotspot::after,
      .slide-nav button { transition: none; }
    }
  </style>
</head>
<body>
  <main id="epk">
    <section class="slide hero" id="hero" aria-label="Renato Bibolotti - menú principal">
      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="assets/hero-poster.webp"
        aria-hidden="true">
        <source src="assets/hero.mp4" type="video/mp4">
      </video>

      <h1 class="hero-title">Renato Bibolotti</h1>

      <nav class="hero-menu" aria-label="Secciones de Drummer Career">
        <a class="hero-link" href="#live-performance">Live Performance</a>
        <a class="hero-link" href="#photos">Photos</a>
        <a class="hero-link" href="#studio-recordings">Studio Recordings</a>
        <a class="hero-link" href="#bio">Bio</a>
        <a class="hero-link" href="#contact">Contact</a>
      </nav>
    </section>

    <section class="slide" id="live-performance" aria-label="Live Performance">
      <img class="slide-image" src="assets/slide-2.webp" width="1920" height="1080" alt="Live Performance de Renato Bibolotti" loading="eager">

      <div class="embed youtube-embed" id="youtube-video-container">
        <iframe
          id="youtube-player"
          src="https://www.youtube-nocookie.com/embed/H-t0T68zU3g?autoplay=1&amp;mute=1&amp;playsinline=1&amp;controls=1&amp;enablejsapi=1&amp;rel=0"
          title="Live Performance de Renato Bibolotti"
          loading="eager"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>

        <div class="video-controls" aria-label="Controles adicionales del video">
          <button
            class="video-control"
            id="youtube-audio-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Activar sonido"
            title="Activar sonido"
            disabled>
            <svg class="audio-icon-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
              <path d="m16 9 5 5"></path>
              <path d="m21 9-5 5"></path>
            </svg>
            <svg class="audio-icon-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
              <path d="M15 9.5a4 4 0 0 1 0 5"></path>
              <path d="M18 7a7 7 0 0 1 0 10"></path>
            </svg>
            <span class="control-label" id="audio-toggle-label">Activar sonido</span>
          </button>

          <button
            class="video-control"
            id="youtube-fullscreen-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Ampliar video a pantalla completa"
            title="Pantalla completa">
            <svg class="fullscreen-icon-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5"></path>
              <path d="m3 3 6 6"></path>
              <path d="M16 3h5v5"></path>
              <path d="m21 3-6 6"></path>
              <path d="M8 21H3v-5"></path>
              <path d="m3 21 6-6"></path>
              <path d="M16 21h5v-5"></path>
              <path d="m21 21-6-6"></path>
            </svg>
            <svg class="fullscreen-icon-close" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 9H4V4"></path>
              <path d="m4 9 5-5"></path>
              <path d="M15 9h5V4"></path>
              <path d="m20 9-5-5"></path>
              <path d="M9 15H4v5"></path>
              <path d="m4 15 5 5"></path>
              <path d="M15 15h5v5"></path>
              <path d="m20 15-5 5"></path>
            </svg>
            <span class="control-label" id="fullscreen-toggle-label">Pantalla completa</span>
          </button>
        </div>
      </div>
    </section>

    <section class="slide" id="photos" aria-label="Photos">
      <img class="slide-image" src="assets/slide-3.webp" width="1920" height="1080" alt="Galería de fotos de Renato Bibolotti" loading="lazy">
    </section>

    <section class="slide" id="studio-recordings" aria-label="Studio Recordings - lanzamientos">
      <img class="slide-image" src="assets/slide-4.webp" width="1920" height="1080" alt="Cuatro grabaciones de estudio" loading="lazy">

      <a class="hotspot recording-link recording-aka"
         href="https://youtube.com/playlist?list=OLAK5uy_lEsRF1Dg28vjyRyB6fU1HoZ0NbEiOnwrE&amp;si=iQGVmmjPto7TR8af"
         target="_blank" rel="noopener noreferrer"
         aria-label="Abrir la playlist de AKA 69 en una pestaña nueva"></a>

      <a class="hotspot recording-link recording-rose"
         href="https://youtu.be/TgoQZyDCOCQ?si=8ExF0UFDaHMPBqWj"
         target="_blank" rel="noopener noreferrer"
         aria-label="Abrir Lo que siento por ti en una pestaña nueva"></a>

      <a class="hotspot recording-link recording-skull"
         href="https://youtu.be/8MCX5RfuOC0?si=Tx6al2bNb5pwOG97"
         target="_blank" rel="noopener noreferrer"
         aria-label="Abrir Sr. Charlie - DC Trase Sessions en una pestaña nueva"></a>

      <a class="hotspot recording-link recording-eye"
         href="https://soundcloud.com/sanbibolotti/sigues-siendo-tu?in=sanbibolotti/sets/drum-by-renato-bibolotti&amp;si=febb198562f040598783ad49baf27a43&amp;utm_source=clipboard&amp;utm_medium=text&amp;utm_campaign=social_sharing"
         target="_blank" rel="noopener noreferrer"
         aria-label="Abrir Sigues siendo tú en SoundCloud, en una pestaña nueva"></a>
    </section>

    <section class="slide" id="studio-player" aria-label="Studio Recordings - reproductor de SoundCloud">
      <img class="slide-image" src="assets/slide-5.webp" width="1920" height="1080" alt="Studio Recordings" loading="lazy">

      <div class="embed soundcloud-embed">
        <iframe
          class="soundcloud-player soundcloud-player-visual"
          scrolling="no"
          allow="autoplay; encrypted-media"
          loading="lazy"
          title="DRUMS BY RENATO BIBOLOTTI en SoundCloud"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2272573520&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=false&amp;show_comments=true&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=true&amp;visual=true"></iframe>
        <iframe
          class="soundcloud-player soundcloud-player-list"
          scrolling="no"
          allow="autoplay; encrypted-media"
          loading="lazy"
          title="Lista de canciones DRUMS BY RENATO BIBOLOTTI en SoundCloud"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2272573520&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=false&amp;show_comments=true&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=true&amp;show_artwork=true&amp;visual=false"></iframe>
      </div>
    </section>

    <section class="slide" id="bio" aria-label="Biografía - primera parte">
      <img class="slide-image" src="assets/slide-6.webp" width="1920" height="1080" alt="Biografía de Renato Bibolotti, primera parte" loading="lazy">
    </section>

    <section class="slide" id="career" aria-label="Biografía - segunda parte">
      <img class="slide-image" src="assets/slide-7.webp" width="1920" height="1080" alt="Biografía y trayectoria de Renato Bibolotti, segunda parte" loading="lazy">
    </section>

    <section class="slide" id="contact" aria-label="Contacto de Renato Bibolotti">
      <img class="slide-image" src="assets/slide-8.webp" width="1920" height="1080" alt="Contacto de Renato Bibolotti" loading="lazy">
      <a class="hotspot contact-hotspot contact-email" data-icon="✉" href="mailto:renabiboovie@hotmail.com" aria-label="Enviar correo a renabiboovie@hotmail.com"></a>
      <a class="hotspot contact-hotspot contact-phone" data-icon="☎" href="tel:+51907903082" aria-label="Llamar al 907 903 082"></a>
      <a class="hotspot contact-hotspot contact-instagram" data-icon="↗" href="https://www.instagram.com/sanbibolotti/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram de San Bibolotti"></a>
    </section>
  </main>

  <nav class="slide-nav" aria-label="Navegación de slides">
    <button type="button" aria-label="Ir al hero" aria-current="true" data-target="hero"></button>
    <button type="button" aria-label="Ir a Live Performance" aria-current="false" data-target="live-performance"></button>
    <button type="button" aria-label="Ir a Photos" aria-current="false" data-target="photos"></button>
    <button type="button" aria-label="Ir a Studio Recordings" aria-current="false" data-target="studio-recordings"></button>
    <button type="button" aria-label="Ir al reproductor de Studio Recordings" aria-current="false" data-target="studio-player"></button>
    <button type="button" aria-label="Ir a Bio" aria-current="false" data-target="bio"></button>
    <button type="button" aria-label="Ir a la segunda parte de Bio" aria-current="false" data-target="career"></button>
    <button type="button" aria-label="Ir a Contact" aria-current="false" data-target="contact"></button>
  </nav>

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const navButtons = [...document.querySelectorAll('.slide-nav button')];
      const interactiveItems = [...document.querySelectorAll('.hero-link, .hotspot')];

      const scrollToTarget = (id) => {
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      navButtons.forEach((button) => {
        button.addEventListener('click', () => scrollToTarget(button.dataset.target));
      });

      document.querySelectorAll('.hero-link').forEach((link) => {
        link.addEventListener('click', (event) => {
          const id = link.hash.slice(1);
          if (!id) return;
          event.preventDefault();
          history.replaceState(null, '', `#${id}`);
          scrollToTarget(id);
        });
      });

      interactiveItems.forEach((item) => {
        item.addEventListener('pointerdown', () => {
          item.classList.add('is-interacting');
          window.setTimeout(() => item.classList.remove('is-interacting'), 650);
        });
        item.addEventListener('pointercancel', () => item.classList.remove('is-interacting'));
      });

      const setActive = (id) => {
        navButtons.forEach((button) => {
          button.setAttribute('aria-current', String(button.dataset.target === id));
        });
      };

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      }, {
        rootMargin: '-35% 0px -35% 0px',
        threshold: [0, 0.1, 0.25, 0.5, 0.75, 1]
      });

      slides.forEach((slide) => observer.observe(slide));

      /* El hero siempre permanece silenciado; no se expone ningún control de audio. */
      const heroVideo = document.querySelector('.hero-video');
      if (heroVideo) {
        heroVideo.muted = true;
        heroVideo.defaultMuted = true;
        heroVideo.play().catch(() => {});
      }

      /* Controles del video central de Live Performance. */
      const videoContainer = document.getElementById('youtube-video-container');
      const audioButton = document.getElementById('youtube-audio-toggle');
      const audioLabel = document.getElementById('audio-toggle-label');
      const fullscreenButton = document.getElementById('youtube-fullscreen-toggle');
      const fullscreenLabel = document.getElementById('fullscreen-toggle-label');
      let youtubePlayer = null;

      const updateAudioButton = (soundIsOn) => {
        if (!audioButton) return;
        const label = soundIsOn ? 'Silenciar' : 'Activar sonido';
        audioButton.setAttribute('aria-pressed', String(soundIsOn));
        audioButton.setAttribute('aria-label', label);
        audioButton.title = label;
        if (audioLabel) audioLabel.textContent = label;
      };

      window.onYouTubeIframeAPIReady = () => {
        youtubePlayer = new YT.Player('youtube-player', {
          events: {
            onReady: (event) => {
              event.target.mute();
              event.target.playVideo();
              updateAudioButton(false);
              audioButton?.removeAttribute('disabled');
            }
          }
        });
      };

      audioButton?.addEventListener('click', () => {
        if (!youtubePlayer || typeof youtubePlayer.isMuted !== 'function') return;

        if (youtubePlayer.isMuted() || youtubePlayer.getVolume() === 0) {
          youtubePlayer.setVolume(100);
          youtubePlayer.unMute();
          updateAudioButton(true);
        } else {
          youtubePlayer.mute();
          updateAudioButton(false);
        }
      });

      if (window.YT?.Player) {
        window.onYouTubeIframeAPIReady();
      } else {
        const youtubeApiScript = document.createElement('script');
        youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
        youtubeApiScript.async = true;
        document.head.appendChild(youtubeApiScript);
      }

      const activeFullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;

      const updateFullscreenButton = () => {
        const isFullscreen = activeFullscreenElement() === videoContainer;
        const label = isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa';
        fullscreenButton?.setAttribute('aria-pressed', String(isFullscreen));
        fullscreenButton?.setAttribute('aria-label', isFullscreen ? 'Cerrar video en pantalla completa' : 'Ampliar video a pantalla completa');
        if (fullscreenButton) fullscreenButton.title = label;
        if (fullscreenLabel) fullscreenLabel.textContent = label;
      };

      const enterFullscreen = async () => {
        if (!videoContainer) return;
        if (videoContainer.requestFullscreen) {
          await videoContainer.requestFullscreen();
        } else if (videoContainer.webkitRequestFullscreen) {
          videoContainer.webkitRequestFullscreen();
        }
      };

      const exitFullscreen = async () => {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      };

      fullscreenButton?.addEventListener('click', async () => {
        try {
          if (activeFullscreenElement() === videoContainer) {
            await exitFullscreen();
          } else {
            await enterFullscreen();
          }
        } catch (error) {
          console.warn('No se pudo cambiar el modo de pantalla completa.', error);
        }
      });

      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
      updateFullscreenButton();
    })();
  </script>
</body>
</html>
